name = "image-generator"
compatibility_date = "2025-12-01"

# Pages configuration
pages_build_output_dir = "public"

# R2 bucket binding
[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "midjourney-images"
preview_bucket_name = "midjourney-images-preview"

# Environment variables
# Set these using: wrangler secret put <KEY_NAME>
#
# Required:
# - APIFRAME_API_KEY: Your APIFRAME API key (get it from https://apiframe.ai)
#
# The app uses APIFRAME (https://apiframe.ai) for Midjourney image generation
# Endpoints:
# - Imagine: https://api.apiframe.pro/imagine
# - Fetch: https://api.apiframe.pro/fetch

name = "image-generator"
compatibility_date = "2024-01-01"

# Pages configuration
pages_build_output_dir = "public"

# R2 bucket binding
[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "midjourney-images"
preview_bucket_name = "midjourney-images-preview"

# Environment variables
# Set these using: wrangler secret put <KEY_NAME>
#
# Required:
# - MIDJOURNEY_API_KEY: Your Midjourney API key
#
# Optional (with defaults):
# - MIDJOURNEY_API_ENDPOINT: API endpoint for image generation (default: https://api.midjourneyapi.io/v2/imagine)
# - MIDJOURNEY_API_STATUS_ENDPOINT: API endpoint for status checks (default: https://api.midjourneyapi.io/v2/status/{taskId})

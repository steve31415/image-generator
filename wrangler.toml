name = "image-generator"
compatibility_date = "2025-12-01"

# Pages configuration
pages_build_output_dir = "public"

# R2 bucket binding
[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "midjourney-images"
preview_bucket_name = "midjourney-images-preview"

# Environment variables
# Set these using: wrangler secret put <KEY_NAME>
#
# Required (at least one):
# - GEMINI_API_KEY: Google Gemini API key for Nano Banana Pro image generation
# - APIFRAME_API_KEY: Your APIFRAME API key for Midjourney (get it from https://apiframe.ai)
#
# Providers:
# - Nano Banana Pro (default): Uses Google Gemini (gemini-3-pro-image-preview)
# - Midjourney: Uses APIFRAME (https://apiframe.ai)

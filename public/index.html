<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5rem;
        }

        .input-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
            background: white;
        }

        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 150px;
            font-family: inherit;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            margin: 0 auto;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-section {
            margin: 30px 0;
            text-align: center;
            display: none;
        }

        .progress-section.active {
            display: block;
        }

        .progress-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            width: 0%;
        }

        .share-section {
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .share-section.active {
            display: block;
        }

        .share-url {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-family: monospace;
            word-break: break-all;
            margin: 10px 0;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .image-card {
            position: relative;
            aspect-ratio: 4/3;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-card.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #f0f0f0 0%, #e0e0e0 50%, #f0f0f0 100%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .image-card .prompt-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            max-height: 60%;
            overflow-y: auto;
        }

        .image-card:hover .prompt-overlay {
            opacity: 1;
        }

        .image-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 1;
        }

        .single-image-view {
            grid-column: 1 / -1;
            text-align: center;
        }

        .single-image-view img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 80vh;
            min-width: min(800px, 100%);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .single-image-view .image-info {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
        }

        .single-image-view .image-info h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .single-image-view .image-info p {
            color: #555;
            line-height: 1.6;
        }

        .single-image-view .nav-links {
            margin-top: 20px;
        }

        .single-image-view .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .single-image-view .nav-links a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .info-text {
            text-align: center;
            color: #777;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .settings-link {
            text-align: center;
            margin-top: 15px;
        }

        .settings-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .settings-link a:hover {
            text-decoration: underline;
        }

        .settings-section {
            display: none;
            background: #f8f9fa;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .settings-section.active {
            display: block;
        }

        .settings-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .settings-section textarea {
            min-height: 80px;
        }

        .settings-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .settings-buttons button {
            padding: 10px 25px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: white;
            color: #555;
            border-color: #ddd;
        }

        .btn-reset:hover {
            border-color: #999;
        }

        .btn-back {
            background: white;
            color: #667eea;
            border-color: #667eea;
        }

        .btn-back:hover {
            background: #f0f2ff;
        }

        .settings-saved {
            text-align: center;
            color: #28a745;
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Generator</h1>

        <div class="input-section" id="inputSection">
            <div class="form-group">
                <label for="provider">Provider:</label>
                <select id="provider">
                    <option value="gemini">Nano Banana Pro</option>
                    <option value="midjourney">Midjourney</option>
                </select>
            </div>

            <div class="form-group">
                <label for="imageCount">Number of Images:</label>
                <input type="number" id="imageCount" value="16" min="1" max="120">
            </div>

            <div class="form-group">
                <label for="prompts">Image Prompts (one per line):</label>
                <textarea id="prompts" placeholder="Enter prompts, one per line...&#10;Example:&#10;Mountain landscape at sunset&#10;Ocean waves crashing on beach&#10;City skyline at night"></textarea>
            </div>

            <button class="submit-btn" id="submitBtn">Generate Images</button>
            <div class="settings-link"><a href="#" id="settingsLink">Settings</a></div>
        </div>

        <div class="settings-section" id="settingsSection">
            <h2>Settings</h2>

            <div class="form-group">
                <label for="geminiTemplate">Nano Banana Pro Prompt Template:</label>
                <textarea id="geminiTemplate" placeholder="Leave empty for no template. The user prompt will be appended after this text."></textarea>
            </div>

            <div class="form-group">
                <label for="midjourneyTemplate">Midjourney Prompt Template:</label>
                <textarea id="midjourneyTemplate" placeholder="Style description appended to prompts for Midjourney generation."></textarea>
            </div>

            <div class="settings-buttons">
                <button class="btn-save" id="saveSettingsBtn">Save</button>
                <button class="btn-reset" id="resetSettingsBtn">Reset to Defaults</button>
                <button class="btn-back" id="backFromSettingsBtn">Back</button>
            </div>
            <div class="settings-saved" id="settingsSaved">Settings saved!</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="progress-section" id="progressSection">
            <div class="progress-text" id="progressText">Generating images: 0 / 60</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="share-section" id="shareSection">
            <h3>Share this collection:</h3>
            <div class="share-url" id="shareUrl"></div>
        </div>

        <div class="image-grid" id="imageGrid"></div>
    </div>

    <script>
        const API_BASE = '';
        let generationId = null;
        let totalImages = 0;
        let completedImages = 0;

        // Default Midjourney prompt template (existing Art Deco style)
        const DEFAULT_MIDJOURNEY_TEMPLATE = 'In the style of a vintage 1920 Art Deco travel poster. Bold geometric shapes, limited color palette, strong lines, sophisticated retro futurist style.';

        // Settings management
        function getSettings() {
            try {
                const stored = localStorage.getItem('imageGenSettings');
                if (stored) return JSON.parse(stored);
            } catch (e) {
                console.error('Failed to load settings:', e);
            }
            return { geminiTemplate: '', midjourneyTemplate: DEFAULT_MIDJOURNEY_TEMPLATE };
        }

        function saveSettings(settings) {
            localStorage.setItem('imageGenSettings', JSON.stringify(settings));
        }

        function resetSettings() {
            const defaults = { geminiTemplate: '', midjourneyTemplate: DEFAULT_MIDJOURNEY_TEMPLATE };
            saveSettings(defaults);
            return defaults;
        }

        // Provider helpers
        function getBatchSize(provider) {
            return provider === 'midjourney' ? 4 : 1;
        }

        function getMaxConcurrency(provider) {
            return provider === 'midjourney' ? 15 : 10;
        }

        function getSelectedProvider() {
            const el = document.getElementById('provider');
            return el ? el.value : 'gemini';
        }

        // Persist provider selection
        function loadProviderSelection() {
            try {
                const saved = localStorage.getItem('imageGenProvider');
                if (saved) {
                    const el = document.getElementById('provider');
                    if (el) el.value = saved;
                }
            } catch (e) {
                console.error('Failed to load provider selection:', e);
            }
        }

        function saveProviderSelection(provider) {
            localStorage.setItem('imageGenProvider', provider);
        }

        // Concurrency limiter: run tasks with max concurrent limit
        async function runWithConcurrency(taskFns, maxConcurrent) {
            const results = [];
            let index = 0;

            async function runNext() {
                while (index < taskFns.length) {
                    const currentIndex = index++;
                    results[currentIndex] = await taskFns[currentIndex]().catch(e => ({ error: e }));
                }
            }

            const workers = [];
            for (let i = 0; i < Math.min(maxConcurrent, taskFns.length); i++) {
                workers.push(runNext());
            }
            await Promise.all(workers);
            return results;
        }

        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                count: parseInt(params.get('count')) || 0,
                image: parseInt(params.get('image')) || 0
            };
        }

        // Generate unique ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        }

        // Update URL without reload
        function updateUrl(id, count) {
            const url = new URL(window.location);
            url.searchParams.set('id', id);
            url.searchParams.set('count', count);
            window.history.pushState({}, '', url);

            // Update share section
            document.getElementById('shareSection').classList.add('active');
            document.getElementById('shareUrl').textContent = url.toString();
        }

        // Show error message
        function showError(message) {
            console.error('Error:', message);
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
        }

        // Update progress
        function updateProgress(completed, total) {
            completedImages = completed;
            totalImages = total;

            const progressText = document.getElementById('progressText');
            const progressFill = document.getElementById('progressFill');

            progressText.textContent = `Generating images: ${completed} / ${total}`;
            progressFill.style.width = `${(completed / total) * 100}%`;

            if (completed === total) {
                setTimeout(() => {
                    document.getElementById('progressSection').classList.remove('active');
                }, 2000);
            }
        }

        // Create image card
        function createImageCard(index) {
            const card = document.createElement('div');
            card.className = 'image-card loading';
            card.id = `image-${index}`;
            return card;
        }

        // Update image card with data
        function updateImageCard(index, imageUrl, prompt) {
            const card = document.getElementById(`image-${index}`);
            if (!card) return;

            card.className = 'image-card';
            card.innerHTML = `
                <span class="image-number">${index}</span>
                <img src="${imageUrl}" alt="Generated image ${index}">
                <div class="prompt-overlay">${prompt}</div>
            `;

            card.onclick = () => {
                // Build shareable URL for this specific image
                const url = new URL(window.location);
                url.searchParams.set('image', index);
                window.open(url.toString(), '_blank');
            };
        }

        // Handle single image view mode
        async function handleSingleImage(id, count, imageIndex) {
            console.log('Single image view:', { id, imageIndex });

            // Hide input section
            document.getElementById('inputSection').style.display = 'none';

            // Create the single image view container
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '<div class="single-image-view" id="singleImageContainer">Loading image...</div>';

            try {
                const data = await retrieveImage(id, imageIndex);
                const container = document.getElementById('singleImageContainer');

                // Build URL for viewing all images
                const allImagesUrl = new URL(window.location);
                allImagesUrl.searchParams.delete('image');

                container.innerHTML = `
                    <img src="${data.imageUrl}" alt="Image ${imageIndex}">
                    <div class="image-info">
                        <h3>Image #${imageIndex}</h3>
                        <p><strong>Prompt:</strong> ${data.prompt}</p>
                    </div>
                    <div class="nav-links">
                        <a href="${allImagesUrl.toString()}">← View all images</a>
                    </div>
                `;
            } catch (error) {
                console.error('Failed to load single image:', error);
                const container = document.getElementById('singleImageContainer');
                container.innerHTML = `<p style="color: red;">Failed to load image: ${error.message}</p>`;
            }
        }

        // Generate a batch of images with timeout
        async function generateBatch(id, baseSequence, prompt, provider, promptTemplate) {
            const batchSize = getBatchSize(provider);
            console.log(`[Batch ${baseSequence}] Starting generation (${provider}, batch size ${batchSize}) for prompt:`, prompt);

            // 5 minute timeout for image generation (APIFRAME polling can take a while)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5 * 60 * 1000);

            try {
                const body = { id, baseSequence, prompt, provider };
                if (promptTemplate) body.promptTemplate = promptTemplate;

                const response = await fetch(`/api/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const error = await response.text();
                    console.error(`[Batch ${baseSequence}] API error response:`, error);
                    throw new Error(`HTTP ${response.status}: ${error}`);
                }

                const data = await response.json();
                console.log(`[Batch ${baseSequence}] Generation complete:`, data);

                return data;
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    console.error(`[Batch ${baseSequence}] Generation timed out after 5 minutes`);
                    throw new Error('Generation timed out - the images took too long to generate');
                }
                console.error(`[Batch ${baseSequence}] Generation failed:`, error);
                throw error;
            }
        }

        // Retrieve single image
        async function retrieveImage(id, sequence) {
            console.log(`[${sequence}] Retrieving image`);

            try {
                // Request JSON format to get image URL and metadata
                const response = await fetch(`/api/image/${id}/${sequence}?format=json`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                console.log(`[${sequence}] Retrieved image:`, data);

                return data;
            } catch (error) {
                console.error(`[${sequence}] Retrieval failed:`, error);
                throw error;
            }
        }

        // Handle generation mode
        async function handleGenerate() {
            const requestedCount = parseInt(document.getElementById('imageCount').value);
            const promptsText = document.getElementById('prompts').value.trim();
            const provider = getSelectedProvider();
            const settings = getSettings();
            const promptTemplate = provider === 'gemini' ? settings.geminiTemplate : settings.midjourneyTemplate;
            const batchSize = getBatchSize(provider);
            const maxConcurrency = getMaxConcurrency(provider);

            if (requestedCount > 120) {
                showError('Maximum of 120 images allowed. Please reduce your image count.');
                return;
            }

            if (!promptsText) {
                showError('Please enter at least one prompt');
                return;
            }

            const prompts = promptsText.split('\n').filter(p => p.trim()).map(p => p.trim());

            if (prompts.length === 0) {
                showError('Please enter at least one valid prompt');
                return;
            }

            // Round up to multiple of batchSize
            const imageCount = Math.ceil(requestedCount / batchSize) * batchSize;
            const totalBatches = imageCount / batchSize;

            console.log('Starting generation:', {
                requested: requestedCount,
                actual: imageCount,
                batches: totalBatches,
                batchSize,
                maxConcurrency,
                provider,
                prompts: prompts.length
            });

            // Generate unique ID and update URL
            generationId = generateId();
            updateUrl(generationId, imageCount);

            // Hide input section, show progress
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('submitBtn').disabled = true;

            // Create image grid
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= imageCount; i++) {
                grid.appendChild(createImageCard(i));
            }

            // Calculate batches per prompt
            const batchesPerPrompt = Math.floor(totalBatches / prompts.length);
            const remainder = totalBatches % prompts.length;

            console.log(`Distributing ${totalBatches} batches across ${prompts.length} prompts: ${batchesPerPrompt} each, ${remainder} extra`);

            // Build task functions for concurrency limiter
            let baseSequence = 1;
            let completedImages = 0;
            const taskFns = [];

            for (let i = 0; i < prompts.length; i++) {
                const batchCount = batchesPerPrompt + (i < remainder ? 1 : 0);
                const prompt = prompts[i];

                for (let j = 0; j < batchCount; j++) {
                    const batchBase = baseSequence;
                    baseSequence += batchSize;

                    taskFns.push(() =>
                        generateBatch(generationId, batchBase, prompt, provider, promptTemplate)
                            .then(data => {
                                // Update image cards from this batch
                                for (const img of data.images) {
                                    updateImageCard(img.sequence, img.imageUrl, data.prompt);
                                    completedImages++;
                                    updateProgress(completedImages, imageCount);
                                }
                            })
                            .catch(error => {
                                console.error(`Failed to generate batch ${batchBase}:`, error);
                                // Mark cards in this batch as failed
                                for (let k = 0; k < batchSize; k++) {
                                    const seq = batchBase + k;
                                    const card = document.getElementById(`image-${seq}`);
                                    if (card) {
                                        card.className = 'image-card';
                                        const errMsg = error.message || 'Unknown error';
                                        const shortErr = errMsg.length > 80 ? errMsg.substring(0, 80) + '...' : errMsg;
                                        card.innerHTML = `<div style="padding: 10px; color: red; text-align: center; font-size: 0.8rem; overflow: hidden;">Failed: ${shortErr}</div>`;
                                    }
                                    completedImages++;
                                    updateProgress(completedImages, imageCount);
                                }
                            })
                    );
                }
            }

            await runWithConcurrency(taskFns, maxConcurrency);
            console.log('All batches processed');
        }

        // Handle view mode
        async function handleView(id, count) {
            console.log('View mode:', { id, count });

            // Hide input section, show share URL (no progress bar for already-generated images)
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('shareSection').classList.add('active');
            document.getElementById('shareUrl').textContent = window.location.toString();

            // Create image grid
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                grid.appendChild(createImageCard(i));
            }

            // Retrieve images
            const promises = [];

            for (let seq = 1; seq <= count; seq++) {
                promises.push(
                    retrieveImage(id, seq)
                        .then(data => {
                            updateImageCard(seq, data.imageUrl, data.prompt);
                        })
                        .catch(error => {
                            console.error(`Failed to retrieve image ${seq}:`, error);
                            const card = document.getElementById(`image-${seq}`);
                            if (card) {
                                card.className = 'image-card';
                                card.innerHTML = `<div style="padding: 10px; color: #999; text-align: center;">Image not found</div>`;
                            }
                        })
                );
            }

            await Promise.allSettled(promises);
            console.log('All images loaded');
        }

        // Settings UI
        function showSettings() {
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('settingsSection').classList.add('active');

            const settings = getSettings();
            document.getElementById('geminiTemplate').value = settings.geminiTemplate || '';
            document.getElementById('midjourneyTemplate').value = settings.midjourneyTemplate || '';
        }

        function hideSettings() {
            document.getElementById('settingsSection').classList.remove('active');
            document.getElementById('inputSection').style.display = '';
            document.getElementById('settingsSaved').style.display = 'none';
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const params = getUrlParams();

            if (params.id && params.count > 0 && params.image > 0) {
                // Single image view mode
                handleSingleImage(params.id, params.count, params.image);
            } else if (params.id && params.count > 0) {
                // Gallery view mode
                handleView(params.id, params.count);
            } else {
                // Generation mode - set up event listeners
                loadProviderSelection();

                document.getElementById('provider').addEventListener('change', (e) => {
                    saveProviderSelection(e.target.value);
                });

                document.getElementById('submitBtn').addEventListener('click', handleGenerate);

                document.getElementById('settingsLink').addEventListener('click', (e) => {
                    e.preventDefault();
                    showSettings();
                });

                document.getElementById('saveSettingsBtn').addEventListener('click', () => {
                    saveSettings({
                        geminiTemplate: document.getElementById('geminiTemplate').value,
                        midjourneyTemplate: document.getElementById('midjourneyTemplate').value,
                    });
                    const saved = document.getElementById('settingsSaved');
                    saved.style.display = 'block';
                    setTimeout(() => { saved.style.display = 'none'; }, 2000);
                });

                document.getElementById('resetSettingsBtn').addEventListener('click', () => {
                    const defaults = resetSettings();
                    document.getElementById('geminiTemplate').value = defaults.geminiTemplate;
                    document.getElementById('midjourneyTemplate').value = defaults.midjourneyTemplate;
                    const saved = document.getElementById('settingsSaved');
                    saved.textContent = 'Settings reset to defaults!';
                    saved.style.display = 'block';
                    setTimeout(() => {
                        saved.textContent = 'Settings saved!';
                        saved.style.display = 'none';
                    }, 2000);
                });

                document.getElementById('backFromSettingsBtn').addEventListener('click', hideSettings);
            }
        });
    </script>
</body>
</html>

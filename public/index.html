<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator - Midjourney API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5rem;
        }

        .input-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 150px;
            font-family: inherit;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            margin: 0 auto;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-section {
            margin: 30px 0;
            text-align: center;
            display: none;
        }

        .progress-section.active {
            display: block;
        }

        .progress-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            width: 0%;
        }

        .share-section {
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .share-section.active {
            display: block;
        }

        .share-url {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-family: monospace;
            word-break: break-all;
            margin: 10px 0;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .image-card {
            position: relative;
            aspect-ratio: 4/3;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-card.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #f0f0f0 0%, #e0e0e0 50%, #f0f0f0 100%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .image-card .prompt-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            max-height: 60%;
            overflow-y: auto;
        }

        .image-card:hover .prompt-overlay {
            opacity: 1;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .info-text {
            text-align: center;
            color: #777;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Art Deco Image Generator</h1>

        <div class="input-section" id="inputSection">
            <div class="form-group">
                <label for="imageCount">Number of Images:</label>
                <input type="number" id="imageCount" value="60" min="1" max="200">
            </div>

            <div class="form-group">
                <label for="prompts">Image Prompts (one per line):</label>
                <textarea id="prompts" placeholder="Enter prompts, one per line...&#10;Example:&#10;Mountain landscape at sunset&#10;Ocean waves crashing on beach&#10;City skyline at night"></textarea>
            </div>

            <button class="submit-btn" id="submitBtn">Generate Images</button>
            <p class="info-text">Images will be generated in the style of vintage 1920s Art Deco travel posters</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="progress-section" id="progressSection">
            <div class="progress-text" id="progressText">Generating images: 0 / 60</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="share-section" id="shareSection">
            <h3>Share this collection:</h3>
            <div class="share-url" id="shareUrl"></div>
        </div>

        <div class="image-grid" id="imageGrid"></div>
    </div>

    <script>
        const API_BASE = '';
        let generationId = null;
        let totalImages = 0;
        let completedImages = 0;

        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                count: parseInt(params.get('count')) || 0
            };
        }

        // Generate unique ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        }

        // Update URL without reload
        function updateUrl(id, count) {
            const url = new URL(window.location);
            url.searchParams.set('id', id);
            url.searchParams.set('count', count);
            window.history.pushState({}, '', url);

            // Update share section
            document.getElementById('shareSection').classList.add('active');
            document.getElementById('shareUrl').textContent = url.toString();
        }

        // Show error message
        function showError(message) {
            console.error('Error:', message);
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
        }

        // Update progress
        function updateProgress(completed, total) {
            completedImages = completed;
            totalImages = total;

            const progressText = document.getElementById('progressText');
            const progressFill = document.getElementById('progressFill');

            progressText.textContent = `Generating images: ${completed} / ${total}`;
            progressFill.style.width = `${(completed / total) * 100}%`;

            if (completed === total) {
                setTimeout(() => {
                    document.getElementById('progressSection').classList.remove('active');
                }, 2000);
            }
        }

        // Create image card
        function createImageCard(index) {
            const card = document.createElement('div');
            card.className = 'image-card loading';
            card.id = `image-${index}`;
            return card;
        }

        // Update image card with data
        function updateImageCard(index, imageUrl, prompt) {
            const card = document.getElementById(`image-${index}`);
            if (!card) return;

            card.className = 'image-card';
            card.innerHTML = `
                <img src="${imageUrl}" alt="Generated image ${index}">
                <div class="prompt-overlay">${prompt}</div>
            `;

            card.onclick = () => {
                const newWindow = window.open('', '_blank');
                newWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Image ${index}</title>
                        <style>
                            body { margin: 0; padding: 20px; background: #222; color: white; font-family: sans-serif; }
                            img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
                            .prompt { max-width: 800px; margin: 20px auto; padding: 15px; background: #333; border-radius: 8px; }
                        </style>
                    </head>
                    <body>
                        <img src="${imageUrl}" alt="Generated image">
                        <div class="prompt"><strong>Prompt:</strong> ${prompt}</div>
                    </body>
                    </html>
                `);
            };
        }

        // Generate single image with timeout
        async function generateImage(id, sequence, prompt) {
            console.log(`[${sequence}] Starting generation for prompt:`, prompt);

            // 5 minute timeout for image generation (APIFRAME polling can take a while)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5 * 60 * 1000);

            try {
                const response = await fetch(`/api/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        id,
                        sequence,
                        prompt
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const error = await response.text();
                    console.error(`[${sequence}] API error response:`, error);
                    throw new Error(`HTTP ${response.status}: ${error}`);
                }

                const data = await response.json();
                console.log(`[${sequence}] Generation complete:`, data);

                return data;
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    console.error(`[${sequence}] Generation timed out after 5 minutes`);
                    throw new Error('Generation timed out - the image took too long to generate');
                }
                console.error(`[${sequence}] Generation failed:`, error);
                throw error;
            }
        }

        // Retrieve single image
        async function retrieveImage(id, sequence) {
            console.log(`[${sequence}] Retrieving image`);

            try {
                // Request JSON format to get image URL and metadata
                const response = await fetch(`/api/image/${id}/${sequence}?format=json`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                console.log(`[${sequence}] Retrieved image:`, data);

                return data;
            } catch (error) {
                console.error(`[${sequence}] Retrieval failed:`, error);
                throw error;
            }
        }

        // Handle generation mode
        async function handleGenerate() {
            const imageCount = parseInt(document.getElementById('imageCount').value);
            const promptsText = document.getElementById('prompts').value.trim();

            if (!promptsText) {
                showError('Please enter at least one prompt');
                return;
            }

            const prompts = promptsText.split('\n').filter(p => p.trim()).map(p => p.trim());

            if (prompts.length === 0) {
                showError('Please enter at least one valid prompt');
                return;
            }

            console.log('Starting generation:', { imageCount, prompts: prompts.length });

            // Generate unique ID and update URL
            generationId = generateId();
            updateUrl(generationId, imageCount);

            // Hide input section, show progress
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('submitBtn').disabled = true;

            // Create image grid
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= imageCount; i++) {
                grid.appendChild(createImageCard(i));
            }

            // Calculate images per prompt
            const imagesPerPrompt = Math.floor(imageCount / prompts.length);
            const remainder = imageCount % prompts.length;

            console.log(`Distributing ${imageCount} images across ${prompts.length} prompts: ${imagesPerPrompt} each, ${remainder} extra`);

            // Generate images
            let sequence = 1;
            const promises = [];

            for (let i = 0; i < prompts.length; i++) {
                const count = imagesPerPrompt + (i < remainder ? 1 : 0);

                for (let j = 0; j < count; j++) {
                    const seq = sequence++;
                    const prompt = prompts[i];

                    promises.push(
                        generateImage(generationId, seq, prompt)
                            .then(data => {
                                updateImageCard(seq, data.imageUrl, data.prompt);
                                updateProgress(promises.filter(p => p.settled).length + 1, imageCount);
                            })
                            .catch(error => {
                                console.error(`Failed to generate image ${seq}:`, error);
                                const card = document.getElementById(`image-${seq}`);
                                if (card) {
                                    card.className = 'image-card';
                                    // Show truncated error message for debugging
                                    const errMsg = error.message || 'Unknown error';
                                    const shortErr = errMsg.length > 100 ? errMsg.substring(0, 100) + '...' : errMsg;
                                    card.innerHTML = `<div style="padding: 10px; color: red; text-align: center; font-size: 0.8rem; overflow: hidden;">Failed: ${shortErr}</div>`;
                                }
                                updateProgress(promises.filter(p => p.settled).length + 1, imageCount);
                            })
                            .finally(() => {
                                promises.find(p => p === promise).settled = true;
                            })
                    );

                    const promise = promises[promises.length - 1];
                    promise.settled = false;
                }
            }

            await Promise.allSettled(promises);
            console.log('All images processed');
        }

        // Handle view mode
        async function handleView(id, count) {
            console.log('View mode:', { id, count });

            // Hide input section, show progress
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('shareSection').classList.add('active');
            document.getElementById('shareUrl').textContent = window.location.toString();

            // Create image grid
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                grid.appendChild(createImageCard(i));
            }

            // Retrieve images
            const promises = [];

            for (let seq = 1; seq <= count; seq++) {
                promises.push(
                    retrieveImage(id, seq)
                        .then(data => {
                            updateImageCard(seq, data.imageUrl, data.prompt);
                            updateProgress(promises.filter(p => p.settled).length + 1, count);
                        })
                        .catch(error => {
                            console.error(`Failed to retrieve image ${seq}:`, error);
                            updateProgress(promises.filter(p => p.settled).length + 1, count);
                        })
                        .finally(() => {
                            promises.find(p => p === promise).settled = true;
                        })
                );

                const promise = promises[promises.length - 1];
                promise.settled = false;
            }

            await Promise.allSettled(promises);
            console.log('All images loaded');
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const params = getUrlParams();

            if (params.id && params.count > 0) {
                handleView(params.id, params.count);
            } else {
                document.getElementById('submitBtn').addEventListener('click', handleGenerate);
            }
        });
    </script>
</body>
</html>
